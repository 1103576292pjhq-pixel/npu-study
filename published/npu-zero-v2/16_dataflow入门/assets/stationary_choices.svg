<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-labelledby="title desc">
  <title id="title">三种 stationary 直觉</title>
  <desc id="desc">weight-stationary、output-stationary 和 input-stationary 分别让不同数据尽量停留。</desc>
  <rect width="940" height="400" fill="#fff7ed"/>
  <text x="470" y="44" text-anchor="middle" font-size="26" font-family="Arial, sans-serif" fill="#7c2d12">stationary = 某类数据在一段计算里尽量少动</text>
  <g font-family="Arial, sans-serif" fill="#1f2937">
    <rect x="55" y="95" width="250" height="230" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="180" y="136" text-anchor="middle" font-size="23">weight-stationary</text>
    <circle cx="180" cy="185" r="38" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/>
    <text x="180" y="192" text-anchor="middle" font-size="20">W 停</text>
    <text x="180" y="245" text-anchor="middle" font-size="17">输入流过权重</text>
    <text x="180" y="275" text-anchor="middle" font-size="17">减少权重搬运</text>
    <rect x="345" y="95" width="250" height="230" rx="18" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="470" y="136" text-anchor="middle" font-size="23">output-stationary</text>
    <circle cx="470" cy="185" r="38" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <text x="470" y="192" text-anchor="middle" font-size="20">SUM 停</text>
    <text x="470" y="245" text-anchor="middle" font-size="17">部分和本地累加</text>
    <text x="470" y="275" text-anchor="middle" font-size="17">完成后写出</text>
    <rect x="635" y="95" width="250" height="230" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="760" y="136" text-anchor="middle" font-size="23">input-stationary</text>
    <circle cx="760" cy="185" r="38" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="760" y="192" text-anchor="middle" font-size="20">X 停</text>
    <text x="760" y="245" text-anchor="middle" font-size="17">输入服务多个输出</text>
    <text x="760" y="275" text-anchor="middle" font-size="17">减少输入搬运</text>
  </g>
</svg>
