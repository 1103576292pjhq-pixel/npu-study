<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320">
  <rect width="780" height="320" fill="#fff"/>
  <style>.loop{fill:#fff7ed;stroke:#c05621;stroke-width:2;rx:8}.pe{fill:#f0fff4;stroke:#2f855a;stroke-width:2;rx:8}.time{fill:#eef6ff;stroke:#2b6cb0;stroke-width:2;rx:8}.t{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;fill:#1a202c}.s{font-size:13px;fill:#2d3748}.a{stroke:#4a5568;stroke-width:2;marker-end:url(#arr)}</style>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker></defs>
  <text x="390" y="28" text-anchor="middle" class="t">同一组循环维度，可以映射到空间，也可以映射到时间</text>
  <rect x="40" y="75" width="150" height="70" class="loop"/><text x="115" y="104" text-anchor="middle" class="t">输出维</text><text x="115" y="126" text-anchor="middle" class="s">oc / oh / ow</text>
  <rect x="40" y="190" width="150" height="70" class="loop"/><text x="115" y="219" text-anchor="middle" class="t">归约维</text><text x="115" y="241" text-anchor="middle" class="s">ic / r / s</text>
  <rect x="310" y="55" width="170" height="110" class="pe"/><text x="395" y="93" text-anchor="middle" class="t">空间映射</text><text x="395" y="118" text-anchor="middle" class="s">多个 PE 同时做</text><text x="395" y="141" text-anchor="middle" class="s">需要并行供数</text>
  <rect x="310" y="185" width="170" height="90" class="time"/><text x="395" y="220" text-anchor="middle" class="t">时间映射</text><text x="395" y="245" text-anchor="middle" class="s">同一 PE 多拍复用</text>
  <rect x="600" y="100" width="135" height="120" class="pe"/><text x="668" y="138" text-anchor="middle" class="t">硬件计划</text><text x="668" y="164" text-anchor="middle" class="s">PE + buffer</text><text x="668" y="187" text-anchor="middle" class="s">DMA + 地址</text>
  <line x1="190" y1="110" x2="310" y2="110" class="a"/><line x1="190" y1="225" x2="310" y2="225" class="a"/>
  <line x1="480" y1="110" x2="600" y2="145" class="a"/><line x1="480" y1="225" x2="600" y2="185" class="a"/>
</svg>
