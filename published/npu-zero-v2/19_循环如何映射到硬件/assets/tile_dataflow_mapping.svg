<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#2b5c7a"/>
    </marker>
    <style>
      .title { font: 700 25px sans-serif; fill: #183247; }
      .label { font: 600 17px sans-serif; fill: #183247; }
      .small { font: 14px sans-serif; fill: #34495e; }
      .tile { fill: #fff7e6; stroke: #b36b00; stroke-width: 2; rx: 14; }
      .buf { fill: #eaf8ed; stroke: #27733a; stroke-width: 2; rx: 14; }
      .pe { fill: #eef6ff; stroke: #2b5c7a; stroke-width: 2; rx: 14; }
      .out { fill: #f7ebff; stroke: #6c3a8a; stroke-width: 2; rx: 14; }
      .arrow { stroke: #2b5c7a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="430" fill="#ffffff"/>
  <text x="40" y="45" class="title">tile + dataflow：决定哪些数据停留，哪些数据流动</text>

  <rect x="55" y="105" width="170" height="95" class="tile"/>
  <text x="105" y="140" class="label">tile 选择</text>
  <text x="84" y="168" class="small">OC_tile, OH_tile</text>
  <text x="89" y="190" class="small">IC_tile, R, S</text>

  <rect x="300" y="75" width="170" height="85" class="buf"/>
  <text x="342" y="110" class="label">输入 buffer</text>
  <text x="333" y="136" class="small">相邻窗口复用</text>

  <rect x="300" y="190" width="170" height="85" class="buf"/>
  <text x="342" y="225" class="label">权重 buffer</text>
  <text x="327" y="251" class="small">多个空间位置复用</text>

  <rect x="545" y="120" width="170" height="120" class="pe"/>
  <text x="590" y="155" class="label">PE 阵列</text>
  <text x="580" y="185" class="small">空间并行输出</text>
  <text x="577" y="210" class="small">时间累加归约</text>

  <rect x="790" y="120" width="130" height="120" class="out"/>
  <text x="824" y="155" class="label">psum</text>
  <text x="812" y="185" class="small">本地暂存</text>
  <text x="812" y="210" class="small">完成后写回</text>

  <path d="M225 152 H292" class="arrow"/>
  <path d="M225 152 C260 152 260 232 292 232" class="arrow"/>
  <path d="M470 118 C505 118 510 155 537 165" class="arrow"/>
  <path d="M470 232 C505 232 510 205 537 195" class="arrow"/>
  <path d="M715 180 H782" class="arrow"/>

  <text x="80" y="350" class="small">dataflow 的选择会改变停留对象：可以偏向输入复用、权重复用，或让部分和尽量留在本地。</text>
</svg>
