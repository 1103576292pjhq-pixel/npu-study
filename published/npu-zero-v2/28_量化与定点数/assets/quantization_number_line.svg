<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-label="真实数映射到量化整数格点">
  <rect width="960" height="380" fill="#fbfaf7"/>
  <text x="44" y="46" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#222">量化：把连续真实数贴到整数格点</text>
  <line x1="120" y1="178" x2="840" y2="178" stroke="#333" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">
    <line x1="160" y1="158" x2="160" y2="198" stroke="#555" stroke-width="2"/>
    <text x="160" y="225">q=-10</text><text x="160" y="247">-1.0</text>
    <line x1="300" y1="158" x2="300" y2="198" stroke="#555" stroke-width="2"/>
    <text x="300" y="225">q=-5</text><text x="300" y="247">-0.5</text>
    <line x1="440" y1="148" x2="440" y2="208" stroke="#d28b1e" stroke-width="3"/>
    <text x="440" y="225">q=0</text><text x="440" y="247">real 0</text>
    <line x1="580" y1="158" x2="580" y2="198" stroke="#555" stroke-width="2"/>
    <text x="580" y="225">q=5</text><text x="580" y="247">0.5</text>
    <line x1="720" y1="158" x2="720" y2="198" stroke="#555" stroke-width="2"/>
    <text x="720" y="225">q=10</text><text x="720" y="247">1.0</text>
  </g>
  <circle cx="653" cy="132" r="8" fill="#4b83c3"/>
  <text x="653" y="105" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#244e7c">real=0.76</text>
  <path d="M653 140 C660 160 678 165 692 174" stroke="#4b83c3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="692" cy="178" r="7" fill="#4b83c3"/>
  <text x="692" y="292" font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#244e7c">round 到 q=8，反量化约 0.8</text>
  <rect x="88" y="300" width="780" height="42" rx="10" fill="#eef5ff" stroke="#b7cdea"/>
  <text x="110" y="327" font-family="Arial, sans-serif" font-size="16" fill="#26384f">公式：real ≈ scale * (q - zero_point)，这里 scale=0.1，zero_point=0。</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b83c3"/>
    </marker>
  </defs>
</svg>
