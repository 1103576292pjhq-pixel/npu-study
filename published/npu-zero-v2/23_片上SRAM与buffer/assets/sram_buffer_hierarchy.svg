<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
  <rect width="920" height="360" fill="#fbfaf6"/>
  <text x="40" y="44" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#22313f">片上 SRAM 位于 DRAM 和 PE 阵列之间</text>
  <rect x="48" y="118" width="160" height="96" rx="14" fill="#dfe8f5" stroke="#476a92" stroke-width="2"/>
  <text x="88" y="154" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f3a5a">外部 DRAM</text>
  <text x="78" y="184" font-family="Arial, sans-serif" font-size="16" fill="#1f3a5a">容量大 / 距离远</text>
  <rect x="286" y="112" width="190" height="108" rx="14" fill="#f7e2b5" stroke="#b47b20" stroke-width="2"/>
  <text x="338" y="150" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#6a4308">DMA</text>
  <text x="316" y="181" font-family="Arial, sans-serif" font-size="16" fill="#6a4308">成块搬入 / 搬出</text>
  <rect x="548" y="82" width="220" height="168" rx="18" fill="#dff0df" stroke="#3f7f54" stroke-width="2"/>
  <text x="592" y="120" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#265537">片上 SRAM</text>
  <rect x="574" y="142" width="68" height="72" rx="8" fill="#ffffff" stroke="#4f9364"/>
  <text x="590" y="170" font-family="Arial, sans-serif" font-size="15" fill="#265537">输入</text>
  <text x="590" y="194" font-family="Arial, sans-serif" font-size="15" fill="#265537">buffer</text>
  <rect x="650" y="142" width="68" height="72" rx="8" fill="#ffffff" stroke="#4f9364"/>
  <text x="666" y="170" font-family="Arial, sans-serif" font-size="15" fill="#265537">权重</text>
  <text x="666" y="194" font-family="Arial, sans-serif" font-size="15" fill="#265537">buffer</text>
  <rect x="726" y="142" width="68" height="72" rx="8" fill="#ffffff" stroke="#4f9364"/>
  <text x="742" y="170" font-family="Arial, sans-serif" font-size="15" fill="#265537">部分和</text>
  <text x="742" y="194" font-family="Arial, sans-serif" font-size="15" fill="#265537">buffer</text>
  <rect x="548" y="286" width="220" height="48" rx="12" fill="#263238"/>
  <text x="600" y="318" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">PE / MAC 阵列</text>
  <path d="M208 166 H286" stroke="#2d4059" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M476 166 H548" stroke="#2d4059" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M658 250 V286" stroke="#2d4059" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="226" y="148" font-family="Arial, sans-serif" font-size="15" fill="#2d4059">大块传输</text>
  <text x="494" y="148" font-family="Arial, sans-serif" font-size="15" fill="#2d4059">当前 tile</text>
  <text x="684" y="274" font-family="Arial, sans-serif" font-size="15" fill="#2d4059">每周期供数</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d4059"/>
