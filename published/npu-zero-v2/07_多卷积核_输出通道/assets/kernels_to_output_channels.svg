<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">kernels to output channels</title>
  <desc id="desc">Multiple kernel groups read the same input feature map and produce different output channels.</desc>
  <style>
    .label { font: 18px sans-serif; fill: #1f2933; }
    .small { font: 14px sans-serif; fill: #52606d; }
    .input { fill: #f8fafc; stroke: #4a5568; stroke-width: 1.5; }
    .kernel { fill: #fff5f5; stroke: #d64545; stroke-width: 1.5; }
    .out { fill: #e6fffa; stroke: #0987a0; stroke-width: 1.5; }
    .arrow { stroke: #1f6feb; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f6feb"/>
    </marker>
  </defs>
  <text x="40" y="42" class="label">Same input, different kernel groups, different output channels</text>
  <g transform="translate(70 120)">
    <text x="0" y="-25" class="label">Input C_in x H x W</text>
    <rect class="input" x="0" y="0" width="115" height="95"/>
    <rect class="input" x="28" y="28" width="115" height="95"/>
    <rect class="input" x="56" y="56" width="115" height="95"/>
  </g>
  <line x1="265" y1="195" x2="350" y2="115" class="arrow"/>
  <line x1="265" y1="195" x2="350" y2="205" class="arrow"/>
  <line x1="265" y1="195" x2="350" y2="295" class="arrow"/>
  <g transform="translate(370 75)">
    <rect class="kernel" x="0" y="0" width="135" height="62" rx="8"/>
    <text x="24" y="38" class="label">kernel 0</text>
    <rect class="kernel" x="0" y="90" width="135" height="62" rx="8"/>
    <text x="24" y="128" class="label">kernel 1</text>
    <rect class="kernel" x="0" y="180" width="135" height="62" rx="8"/>
    <text x="20" y="218" class="label">kernel C_out-1</text>
  </g>
  <line x1="520" y1="106" x2="640" y2="106" class="arrow"/>
  <line x1="520" y1="196" x2="640" y2="196" class="arrow"/>
  <line x1="520" y1="286" x2="640" y2="286" class="arrow"/>
  <g transform="translate(655 75)">
    <rect class="out" x="0" y="0" width="145" height="62" rx="8"/>
    <text x="14" y="38" class="label">out channel 0</text>
    <rect class="out" x="0" y="90" width="145" height="62" rx="8"/>
    <text x="14" y="128" class="label">out channel 1</text>
    <rect class="out" x="0" y="180" width="145" height="62" rx="8"/>
    <text x="11" y="218" class="label">out channel C_out-1</text>
  </g>
  <text x="145" y="365" class="small">Weight shape: C_out x C_in x R x S. Each kernel group sees all input channels.</text>
</svg>
