<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">循环访问顺序与 layout 的关系</title>
  <desc id="desc">比较内层读通道和内层读宽度时，NCHW 与 NHWC 的 offset 是否连续。</desc>
  <defs>
    <style>
      .bg { fill: #f7fbfc; }
      .panel { fill: #ffffff; stroke: #2f464d; stroke-width: 2; rx: 16; }
      .good { fill: #dff5df; stroke: #3f8a47; stroke-width: 2; rx: 10; }
      .warn { fill: #fff0c9; stroke: #a97900; stroke-width: 2; rx: 10; }
      .label { font: 20px "Microsoft YaHei", Arial, sans-serif; fill: #1d3036; }
      .small { font: 15px "Microsoft YaHei", Arial, sans-serif; fill: #2f454b; }
      .code { font: 15px Consolas, "Microsoft YaHei", monospace; fill: #17282d; }
      .arrow { stroke: #2f454b; stroke-width: 2.2; marker-end: url(#arrow); fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2f454b"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="500"/>
  <text class="label" x="42" y="44">layout 要和内层循环一起判断：连续访问才容易喂饱 NPU</text>

  <rect class="panel" x="50" y="80" width="410" height="165"/>
  <text class="label" x="78" y="118">内层循环读通道 ic</text>
  <text class="code" x="78" y="153">for ic: read input[n][ic][h][w]</text>
  <rect class="warn" x="78" y="178" width="145" height="42"/><text class="code" x="96" y="205">NCHW: 0,4,8</text>
  <rect class="good" x="250" y="178" width="145" height="42"/><text class="code" x="268" y="205">NHWC: 0,1,2</text>
  <text class="small" x="78" y="232">同一像素多个通道：NHWC 更连续。</text>

  <rect class="panel" x="520" y="80" width="410" height="165"/>
  <text class="label" x="548" y="118">内层循环读宽度 w</text>
  <text class="code" x="548" y="153">for w: read input[n][c][h][w]</text>
  <rect class="good" x="548" y="178" width="145" height="42"/><text class="code" x="566" y="205">NCHW: 0,1</text>
  <rect class="warn" x="720" y="178" width="145" height="42"/><text class="code" x="738" y="205">NHWC: 0,3</text>
  <text class="small" x="548" y="232">固定通道扫空间：NCHW 更连续。</text>

  <rect class="panel" x="120" y="300" width="740" height="125"/>
  <text class="label" x="150" y="337">NPU 判断顺序</text>
  <text class="small" x="150" y="370">1. 先看卷积或算子的循环顺序：下一步最常读哪个维度？</text>
  <text class="small" x="150" y="398">2. 再看 layout 的 stride：这个维度的 stride 是否为 1 或足够规则？</text>
  <text class="small" x="150" y="426">3. 最后评估 DMA、buffer、向量加载能否连续取数。</text>
  <path class="arrow" d="M460 165 C490 165, 495 165, 520 165"/>
</svg>
