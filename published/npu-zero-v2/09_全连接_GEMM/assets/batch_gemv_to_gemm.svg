<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", sans-serif; fill: #172033; }
      .title { font-size: 22px; font-weight: 700; }
      .note { font-size: 14px; fill: #475569; }
      .vec { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .mat { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .label { font-size: 17px; font-weight: 600; }
    </style>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text class="title" x="34" y="42">多个单样本 GEMV 可以合成一个 batch GEMM</text>
  <rect class="vec" x="70" y="88" width="145" height="42"/><text class="label" x="95" y="115">样本 0 xW</text>
  <rect class="vec" x="70" y="145" width="145" height="42"/><text class="label" x="95" y="172">样本 1 xW</text>
  <rect class="vec" x="70" y="202" width="145" height="42"/><text class="label" x="95" y="229">样本 2 xW</text>
  <text class="note" x="80" y="268">分开看：多次 GEMV</text>
  <line x1="245" y1="166" x2="360" y2="166" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="mat" x="390" y="88" width="180" height="156"/>
  <text class="label" x="436" y="154">X[M,K]</text>
  <text class="note" x="422" y="184">多行样本堆叠</text>
  <line x1="590" y1="166" x2="690" y2="166" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="mat" x="715" y="104" width="120" height="124"/>
  <text class="label" x="744" y="157">Y[M,N]</text>
  <text class="note" x="712" y="252">统一调度：一次 GEMM</text>
</svg>
