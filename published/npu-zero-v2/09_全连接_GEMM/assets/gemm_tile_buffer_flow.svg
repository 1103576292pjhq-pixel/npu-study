<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", sans-serif; fill: #172033; }
      .title { font-size: 22px; font-weight: 700; }
      .note { font-size: 14px; fill: #475569; }
      .mem { fill: #f1f5f9; stroke: #475569; stroke-width: 2; rx: 14; }
      .buf { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 14; }
      .pe { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 14; }
      .out { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .label { font-size: 17px; font-weight: 600; }
    </style>
  </defs>
  <rect width="920" height="340" fill="#ffffff"/>
  <text class="title" x="34" y="42">GEMM 分块：让输入块、权重块、部分和尽量留在片上</text>
  <rect class="mem" x="55" y="95" width="130" height="78"/>
  <text class="label" x="85" y="128">外部内存</text>
  <text class="note" x="82" y="152">X, W, Y</text>
  <line x1="190" y1="134" x2="280" y2="134" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="buf" x="300" y="70" width="145" height="58"/>
  <text class="label" x="330" y="105">X tile</text>
  <rect class="buf" x="300" y="150" width="145" height="58"/>
  <text class="label" x="330" y="185">W tile</text>
  <line x1="455" y1="99" x2="545" y2="130" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="455" y1="179" x2="545" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="pe" x="565" y="105" width="135" height="85"/>
  <text class="label" x="598" y="140">PE 阵列</text>
  <text class="note" x="590" y="164">重复 MAC</text>
  <line x1="705" y1="148" x2="785" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="out" x="800" y="105" width="90" height="85"/>
  <text class="label" x="820" y="140">Y tile</text>
  <text class="note" x="808" y="164">部分和</text>
  <path d="M845 195 C800 270, 350 275, 120 180" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="note" x="305" y="286">完成后再写回，避免每次累加都访问外部内存。</text>
</svg>
