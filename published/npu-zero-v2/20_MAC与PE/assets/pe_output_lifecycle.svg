<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">PE 执行一个输出的生命周期</title>
  <desc id="desc">展示 PE 从清零累加器开始，连续执行三次 MAC，最后把 acc 作为输出写回。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#44515a" />
    </marker>
    <style>
      .step { fill: #ffffff; stroke: #436b7a; stroke-width: 2; rx: 14; }
      .done { fill: #eaf6ee; stroke: #2f8a55; stroke-width: 2; rx: 14; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1e2f35; font-size: 22px; font-weight: 700; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #20323a; font-size: 16px; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #40545d; font-size: 13px; }
      .wire { stroke: #44515a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="20" y="20" width="880" height="390" fill="#f6f8f9" stroke="#d5e0e5"/>
  <text x="460" y="62" text-anchor="middle" class="title">一个 PE 计算 y = 3*5 + 2*1 + 4*2</text>

  <rect x="60" y="130" width="140" height="120" class="step"/>
  <text x="130" y="160" text-anchor="middle" class="label" font-weight="700">初始化</text>
  <text x="130" y="195" text-anchor="middle" class="small">clear acc</text>
  <text x="130" y="220" text-anchor="middle" class="label">acc = 0</text>

  <rect x="250" y="130" width="140" height="120" class="step"/>
  <text x="320" y="160" text-anchor="middle" class="label" font-weight="700">周期 1</text>
  <text x="320" y="190" text-anchor="middle" class="small">x=3, w=5</text>
  <text x="320" y="218" text-anchor="middle" class="label">acc = 15</text>

  <rect x="440" y="130" width="140" height="120" class="step"/>
  <text x="510" y="160" text-anchor="middle" class="label" font-weight="700">周期 2</text>
  <text x="510" y="190" text-anchor="middle" class="small">x=2, w=1</text>
  <text x="510" y="218" text-anchor="middle" class="label">acc = 17</text>

  <rect x="630" y="130" width="140" height="120" class="step"/>
  <text x="700" y="160" text-anchor="middle" class="label" font-weight="700">周期 3</text>
  <text x="700" y="190" text-anchor="middle" class="small">x=4, w=2</text>
  <text x="700" y="218" text-anchor="middle" class="label">acc = 25</text>

  <rect x="390" y="300" width="160" height="70" class="done"/>
  <text x="470" y="329" text-anchor="middle" class="label" font-weight="700">写回输出</text>
  <text x="470" y="354" text-anchor="middle" class="label">y = acc = 25</text>

  <path d="M200 190 L250 190" class="wire"/>
  <path d="M390 190 L440 190" class="wire"/>
  <path d="M580 190 L630 190" class="wire"/>
  <path d="M700 250 C700 294,560 318,550 330" class="wire"/>

  <text x="460" y="95" text-anchor="middle" class="small">PE 的工作不只是三次 MAC，还包含清零、状态保存和完成后写回。</text>
</svg>
