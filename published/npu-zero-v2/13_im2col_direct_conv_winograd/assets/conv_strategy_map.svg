<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">卷积实现策略分岔图</title>
  <desc id="desc">同一个卷积可以走 direct、im2col 或 Winograd 三条执行路径。</desc>
  <rect width="920" height="360" fill="#f8fafc"/>
  <rect x="345" y="28" width="230" height="58" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="63" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#1e3a8a">同一个卷积</text>
  <path d="M460 86 L210 140" stroke="#475569" stroke-width="3" fill="none"/>
  <path d="M460 86 L460 140" stroke="#475569" stroke-width="3" fill="none"/>
  <path d="M460 86 L710 140" stroke="#475569" stroke-width="3" fill="none"/>
  <rect x="70" y="140" width="280" height="155" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <rect x="320" y="140" width="280" height="155" rx="16" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <rect x="570" y="140" width="280" height="155" rx="16" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="210" y="174" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" fill="#155e75">direct conv</text>
  <text x="460" y="174" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" fill="#854d0e">im2col + GEMM</text>
  <text x="710" y="174" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" fill="#831843">Winograd</text>
  <text x="210" y="214" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#334155">按窗口直接乘加</text>
  <text x="210" y="244" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#334155">临时存储较少</text>
  <text x="210" y="274" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#334155">依赖循环和 buffer 调度</text>
  <text x="460" y="214" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#334155">窗口展开成矩阵</text>
  <text x="460" y="244" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#334155">复用 GEMM 高吞吐</text>
  <text x="460" y="274" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#334155">代价是展开和复制</text>
  <text x="710" y="214" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#334155">先变换再逐点乘</text>
  <text x="710" y="244" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#334155">减少部分乘法</text>
  <text x="710" y="274" text-anchor="middle" font-size="17" font-family="Arial, sans-serif" fill="#334155">受精度和形状限制</text>
</svg>
