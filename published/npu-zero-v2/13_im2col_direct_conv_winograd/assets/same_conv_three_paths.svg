<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">同一卷积的三种执行路径</title>
  <desc id="desc">输入窗口与卷积核可以直接乘加、展开成矩阵乘，或经过 Winograd 变换。</desc>
  <rect width="960" height="420" fill="#fff7ed"/>
  <text x="480" y="42" text-anchor="middle" font-size="26" font-family="Arial, sans-serif" fill="#7c2d12">同一组输入和权重，三种执行路径</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#1f2937">
    <rect x="40" y="82" width="190" height="120" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="135" y="112" text-anchor="middle" font-size="20">输入窗口</text>
    <text x="135" y="150" text-anchor="middle">1 2</text>
    <text x="135" y="178" text-anchor="middle">3 4</text>
    <rect x="40" y="230" width="190" height="120" rx="12" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="135" y="260" text-anchor="middle" font-size="20">卷积核</text>
    <text x="135" y="298" text-anchor="middle">5 6</text>
    <text x="135" y="326" text-anchor="middle">7 8</text>
    <path d="M245 142 H340" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M245 290 H340" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="350" y="70" width="250" height="85" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="475" y="102" text-anchor="middle" font-size="20">direct</text>
    <text x="475" y="132" text-anchor="middle">1*5 + 2*6 + 3*7 + 4*8</text>
    <rect x="350" y="178" width="250" height="85" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="475" y="210" text-anchor="middle" font-size="20">im2col</text>
    <text x="475" y="240" text-anchor="middle">[5 6 7 8] · [1 2 3 4]^T</text>
    <rect x="350" y="286" width="250" height="85" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
    <text x="475" y="318" text-anchor="middle" font-size="20">Winograd</text>
    <text x="475" y="348" text-anchor="middle">变换 -> 少量乘法 -> 反变换</text>
    <path d="M610 112 H730" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M610 220 H730" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M610 328 H730" stroke="#9a3412" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="740" y="170" width="170" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="825" y="208" text-anchor="middle" font-size="22">同一输出</text>
    <text x="825" y="240" text-anchor="middle" font-size="24">70</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#9a3412"/>
    </marker>
  </defs>
</svg>
