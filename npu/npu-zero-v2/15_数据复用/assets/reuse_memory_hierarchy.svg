<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320">
  <rect width="760" height="320" fill="#ffffff"/>
  <style>
    .level{fill:#f7fafc;stroke:#4a5568;stroke-width:2;rx:8}
    .hot{fill:#f0fff4;stroke:#2f855a;stroke-width:2;rx:8}
    .txt{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;fill:#1a202c}
    .small{font-size:13px;fill:#2d3748}
    .arrow{stroke:#4a5568;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>
  <text x="380" y="28" text-anchor="middle" class="txt">复用的目标：让数据尽量在更近的层级被多次使用</text>
  <rect x="45" y="65" width="150" height="70" class="level"/>
  <text x="120" y="94" text-anchor="middle" class="txt">DRAM</text>
  <text x="120" y="117" text-anchor="middle" class="small">远 / 慢 / 贵</text>
  <rect x="240" y="65" width="150" height="70" class="level"/>
  <text x="315" y="94" text-anchor="middle" class="txt">片上 SRAM</text>
  <text x="315" y="117" text-anchor="middle" class="small">tile 与 DMA</text>
  <rect x="435" y="65" width="150" height="70" class="level"/>
  <text x="510" y="94" text-anchor="middle" class="txt">寄存器/PE</text>
  <text x="510" y="117" text-anchor="middle" class="small">psum / 权重驻留</text>
  <rect x="585" y="190" width="130" height="70" class="hot"/>
  <text x="650" y="219" text-anchor="middle" class="txt">MAC</text>
  <text x="650" y="242" text-anchor="middle" class="small">消耗数据</text>
  <line x1="195" y1="100" x2="240" y2="100" class="arrow"/>
  <line x1="390" y1="100" x2="435" y2="100" class="arrow"/>
  <line x1="540" y1="135" x2="625" y2="190" class="arrow"/>
  <path d="M510 65 C510 35 315 35 315 65" fill="none" stroke="#2f855a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="413" y="52" text-anchor="middle" class="small">复用：少回到远端层级</text>
  <text x="380" y="295" text-anchor="middle" class="small">输入复用、权重复用、psum 复用，本质都是减少远端读写并提升 MAC 连续供数能力。</text>
</svg>
