<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Requantization, rounding, and saturation</title>
  <desc id="desc">An int32 accumulator is scaled back to int8 through multiplier, rounding, zero point addition, and saturation.</desc>
  <style>
    text { font-family: Arial, sans-serif; font-size: 15px; fill: #172033; }
    .box { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
    .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    .small { font-size: 13px; fill: #475569; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155" />
    </marker>
  </defs>
  <rect class="box" x="45" y="78" width="140" height="68" />
  <text x="115" y="107" text-anchor="middle" font-weight="bold">int32 acc</text>
  <text class="small" x="115" y="129" text-anchor="middle">sum(qx * qw)</text>
  <rect class="box" x="230" y="78" width="140" height="68" />
  <text x="300" y="107" text-anchor="middle" font-weight="bold">multiply</text>
  <text class="small" x="300" y="129" text-anchor="middle">x_scale*w_scale/y_scale</text>
  <rect class="box" x="415" y="78" width="140" height="68" />
  <text x="485" y="107" text-anchor="middle" font-weight="bold">round</text>
  <text class="small" x="485" y="129" text-anchor="middle">nearest or policy</text>
  <rect class="box" x="600" y="78" width="140" height="68" />
  <text x="670" y="107" text-anchor="middle" font-weight="bold">add zero point</text>
  <text class="small" x="670" y="129" text-anchor="middle">output offset</text>
  <rect class="warn" x="785" y="78" width="100" height="68" />
  <text x="835" y="107" text-anchor="middle" font-weight="bold">clamp</text>
  <text class="small" x="835" y="129" text-anchor="middle">int8 range</text>
  <path class="arrow" d="M185 112 H230" />
  <path class="arrow" d="M370 112 H415" />
  <path class="arrow" d="M555 112 H600" />
  <path class="arrow" d="M740 112 H785" />
  <rect class="warn" x="145" y="238" width="190" height="58" />
  <text x="240" y="262" text-anchor="middle">overflow risk</text>
  <text class="small" x="240" y="282" text-anchor="middle">accumulator too narrow</text>
  <rect class="warn" x="365" y="238" width="190" height="58" />
  <text x="460" y="262" text-anchor="middle">bias risk</text>
  <text class="small" x="460" y="282" text-anchor="middle">rounding mode changes result</text>
  <rect class="warn" x="585" y="238" width="190" height="58" />
  <text x="680" y="262" text-anchor="middle">saturation risk</text>
  <text class="small" x="680" y="282" text-anchor="middle">range too small</text>
  <text class="small" x="460" y="334" text-anchor="middle">Quantization correctness depends on the whole numeric protocol, not only on int8 storage.</text>
</svg>
