<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">NPU compiler pipeline</title>
  <desc id="desc">A model graph is transformed into IR, shape and layout facts, partitioned subgraphs, lowered kernels, tile schedules, memory plans, and runtime tasks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill:#eef6ff; stroke:#2563eb; stroke-width:2; }
      .mid { fill:#f0fdf4; stroke:#16a34a; stroke-width:2; }
      .cut { fill:#fff7ed; stroke:#ea580c; stroke-width:2; }
      .out { fill:#fdf2f8; stroke:#be185d; stroke-width:2; }
      .txt { font-family:Arial, sans-serif; font-size:18px; fill:#0f172a; font-weight:700; }
      .sub { font-family:Arial, sans-serif; font-size:13px; fill:#475569; }
      .line { stroke:#334155; stroke-width:2; marker-end:url(#arrow); }
      .note { font-family:Arial, sans-serif; font-size:15px; fill:#334155; }
    </style>
  </defs>
  <text x="540" y="35" text-anchor="middle" class="txt">NPU 编译器流水线：模型图逐步变成硬件任务</text>

  <rect x="25" y="80" width="130" height="92" rx="10" class="box"/>
  <text x="90" y="115" text-anchor="middle" class="txt">模型图</text>
  <text x="90" y="143" text-anchor="middle" class="sub">Conv / ReLU / Add</text>

  <line x1="155" y1="126" x2="195" y2="126" class="line"/>
  <rect x="195" y="80" width="130" height="92" rx="10" class="box"/>
  <text x="260" y="115" text-anchor="middle" class="txt">IR</text>
  <text x="260" y="143" text-anchor="middle" class="sub">可分析的中间表示</text>

  <line x1="325" y1="126" x2="365" y2="126" class="line"/>
  <rect x="365" y="80" width="140" height="92" rx="10" class="mid"/>
  <text x="435" y="108" text-anchor="middle" class="txt">元数据推导</text>
  <text x="435" y="137" text-anchor="middle" class="sub">shape / dtype / layout</text>

  <line x1="505" y1="126" x2="545" y2="126" class="line"/>
  <rect x="545" y="80" width="135" height="92" rx="10" class="cut"/>
  <text x="612" y="108" text-anchor="middle" class="txt">图切分</text>
  <text x="612" y="137" text-anchor="middle" class="sub">NPU 子图 / fallback</text>

  <line x1="680" y1="126" x2="720" y2="126" class="line"/>
  <rect x="720" y="80" width="135" height="92" rx="10" class="mid"/>
  <text x="787" y="108" text-anchor="middle" class="txt">Lowering</text>
  <text x="787" y="137" text-anchor="middle" class="sub">循环 / kernel / 后端 IR</text>

  <line x1="855" y1="126" x2="895" y2="126" class="line"/>
  <rect x="895" y="80" width="150" height="92" rx="10" class="out"/>
  <text x="970" y="108" text-anchor="middle" class="txt">任务生成</text>
  <text x="970" y="137" text-anchor="middle" class="sub">descriptor / binary</text>

  <rect x="205" y="250" width="170" height="92" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="290" y="282" text-anchor="middle" class="txt">通用层</text>
  <text x="290" y="310" text-anchor="middle" class="sub">尽量少绑定硬件细节</text>

  <rect x="455" y="250" width="170" height="92" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="540" y="282" text-anchor="middle" class="txt">决策层</text>
  <text x="540" y="310" text-anchor="middle" class="sub">支持边界与性能取舍</text>

  <rect x="705" y="250" width="170" height="92" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="790" y="282" text-anchor="middle" class="txt">后端层</text>
  <text x="790" y="310" text-anchor="middle" class="sub">绑定 PE / SRAM / DMA / 命令</text>

  <path d="M260 180 C300 220, 355 230, 455 250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M615 180 C600 220, 585 230, 540 250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M890 180 C870 220, 840 230, 790 250" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>

  <text x="540" y="392" text-anchor="middle" class="note">越往右，表示越接近目标 NPU 的真实硬件约束；越往左，表示越接近通用模型语义。</text>
</svg>
