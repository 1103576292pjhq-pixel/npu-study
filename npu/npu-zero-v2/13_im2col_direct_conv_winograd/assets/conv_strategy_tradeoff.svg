<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330">
  <rect width="780" height="330" fill="#ffffff"/>
  <style>
    .head{fill:#edf2f7;stroke:#4a5568;stroke-width:1}
    .cell{fill:#f7fafc;stroke:#cbd5e0;stroke-width:1}
    .good{fill:#f0fff4;stroke:#9ae6b4;stroke-width:1}
    .warn{fill:#fffaf0;stroke:#fbd38d;stroke-width:1}
    .txt{font-family:Arial,'Microsoft YaHei',sans-serif;font-size:15px;fill:#1a202c}
    .small{font-size:13px;fill:#2d3748}
  </style>
  <text x="390" y="28" text-anchor="middle" class="txt">卷积执行策略不是谁替代谁，而是代价分布不同</text>
  <rect x="35" y="50" width="170" height="50" class="head"/><text x="120" y="81" text-anchor="middle" class="txt">策略</text>
  <rect x="205" y="50" width="180" height="50" class="head"/><text x="295" y="81" text-anchor="middle" class="txt">主要收益</text>
  <rect x="385" y="50" width="180" height="50" class="head"/><text x="475" y="81" text-anchor="middle" class="txt">主要代价</text>
  <rect x="565" y="50" width="180" height="50" class="head"/><text x="655" y="81" text-anchor="middle" class="txt">适合场景</text>
  <rect x="35" y="100" width="170" height="60" class="cell"/><text x="120" y="135" text-anchor="middle" class="txt">direct</text>
  <rect x="205" y="100" width="180" height="60" class="good"/><text x="295" y="125" text-anchor="middle" class="small">少临时矩阵</text><text x="295" y="146" text-anchor="middle" class="small">直接按窗口算</text>
  <rect x="385" y="100" width="180" height="60" class="warn"/><text x="475" y="125" text-anchor="middle" class="small">依赖循环调度</text><text x="475" y="146" text-anchor="middle" class="small">要手动做复用</text>
  <rect x="565" y="100" width="180" height="60" class="cell"/><text x="655" y="125" text-anchor="middle" class="small">SRAM 紧张</text><text x="655" y="146" text-anchor="middle" class="small">tile/direct 支持好</text>
  <rect x="35" y="160" width="170" height="60" class="cell"/><text x="120" y="195" text-anchor="middle" class="txt">im2col</text>
  <rect x="205" y="160" width="180" height="60" class="good"/><text x="295" y="185" text-anchor="middle" class="small">复用 GEMM 路径</text><text x="295" y="206" text-anchor="middle" class="small">矩阵阵列利用率高</text>
  <rect x="385" y="160" width="180" height="60" class="warn"/><text x="475" y="185" text-anchor="middle" class="small">窗口复制</text><text x="475" y="206" text-anchor="middle" class="small">临时矩阵膨胀</text>
  <rect x="565" y="160" width="180" height="60" class="cell"/><text x="655" y="185" text-anchor="middle" class="small">GEMM 硬件强</text><text x="655" y="206" text-anchor="middle" class="small">带宽/空间足够</text>
  <rect x="35" y="220" width="170" height="60" class="cell"/><text x="120" y="255" text-anchor="middle" class="txt">Winograd</text>
  <rect x="205" y="220" width="180" height="60" class="good"/><text x="295" y="245" text-anchor="middle" class="small">减少乘法</text><text x="295" y="266" text-anchor="middle" class="small">小卷积收益大</text>
  <rect x="385" y="220" width="180" height="60" class="warn"/><text x="475" y="245" text-anchor="middle" class="small">变换和误差</text><text x="475" y="266" text-anchor="middle" class="small">buffer 额外压力</text>
  <rect x="565" y="220" width="180" height="60" class="cell"/><text x="655" y="245" text-anchor="middle" class="small">常见 3x3</text><text x="655" y="266" text-anchor="middle" class="small">精度可控</text>
  <text x="390" y="312" text-anchor="middle" class="small">策略选择要同时看计算次数、临时存储、带宽、精度和硬件支持。</text>
</svg>
