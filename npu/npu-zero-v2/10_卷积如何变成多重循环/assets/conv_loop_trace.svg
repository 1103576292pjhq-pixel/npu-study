<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">一个输出值的循环追踪</title>
  <desc id="desc">展示 oh=0, ow=1 时，r/s 四次内层循环如何把部分和从 0 累到 3。</desc>
  <defs>
    <style>
      .bg { fill: #f7fbfc; }
      .box { fill: #ffffff; stroke: #2e4a52; stroke-width: 2; rx: 12; }
      .step { fill: #eef7ff; stroke: #39739d; stroke-width: 1.6; rx: 10; }
      .psum { fill: #fff1cf; stroke: #9a6a00; stroke-width: 1.8; rx: 10; }
      .arrow { stroke: #2e4a52; stroke-width: 2.2; marker-end: url(#arrow); fill: none; }
      .label { font: 18px "Microsoft YaHei", Arial, sans-serif; fill: #1c3036; }
      .small { font: 14px "Microsoft YaHei", Arial, sans-serif; fill: #2f444a; }
      .code { font: 14px Consolas, "Microsoft YaHei", monospace; fill: #17282d; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e4a52"/>
    </marker>
  </defs>
  <rect class="bg" width="920" height="430"/>
  <text class="label" x="40" y="42">追踪 out[0][1]：内层循环只负责把同一个 sum 累完</text>

  <rect class="box" x="38" y="75" width="190" height="285"/>
  <text class="label" x="70" y="110">固定外层</text>
  <text class="code" x="64" y="150">oh = 0</text>
  <text class="code" x="64" y="180">ow = 1</text>
  <text class="code" x="64" y="225">窗口：</text>
  <text class="code" x="82" y="255">0 2</text>
  <text class="code" x="82" y="280">1 3</text>
  <text class="small" x="64" y="325">sum 在此输出位置内存活</text>

  <rect class="step" x="285" y="72" width="145" height="95"/>
  <text class="code" x="305" y="103">r=0, s=0</text>
  <text class="code" x="305" y="130">0 * 1 = 0</text>
  <text class="code" x="305" y="154">sum: 0 -> 0</text>

  <rect class="step" x="285" y="210" width="145" height="95"/>
  <text class="code" x="305" y="241">r=0, s=1</text>
  <text class="code" x="305" y="268">2 * 0 = 0</text>
  <text class="code" x="305" y="292">sum: 0 -> 0</text>

  <rect class="step" x="505" y="72" width="145" height="95"/>
  <text class="code" x="525" y="103">r=1, s=0</text>
  <text class="code" x="525" y="130">1 * 0 = 0</text>
  <text class="code" x="525" y="154">sum: 0 -> 0</text>

  <rect class="step" x="505" y="210" width="145" height="95"/>
  <text class="code" x="525" y="241">r=1, s=1</text>
  <text class="code" x="525" y="268">3 * 1 = 3</text>
  <text class="code" x="525" y="292">sum: 0 -> 3</text>

  <rect class="psum" x="718" y="145" width="160" height="120"/>
  <text class="label" x="755" y="185">写回</text>
  <text class="code" x="742" y="220">out[0][1]</text>
  <text class="code" x="782" y="245">= 3</text>

  <path class="arrow" d="M228 220 C250 115, 260 115, 285 115"/>
  <path class="arrow" d="M430 120 C465 120, 470 120, 505 120"/>
  <path class="arrow" d="M430 257 C465 257, 470 257, 505 257"/>
  <path class="arrow" d="M650 257 C690 230, 700 225, 718 220"/>
  <path class="arrow" d="M357 167 C357 185, 357 190, 357 210"/>
  <text class="small" x="312" y="390">判断 cue：只要 oh/ow 不变，所有 r/s 迭代都在更新同一个部分和。</text>
</svg>
