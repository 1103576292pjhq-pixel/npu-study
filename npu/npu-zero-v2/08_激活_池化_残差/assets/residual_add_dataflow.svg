<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "SimHei", sans-serif; fill: #172033; }
      .box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 14; }
      .buf { fill: #fff7ed; stroke: #f97316; stroke-width: 2; rx: 14; }
      .add { fill: #ecfdf5; stroke: #16a34a; stroke-width: 3; }
      .title { font-size: 22px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 600; }
      .note { font-size: 14px; fill: #475569; }
    </style>
  </defs>
  <rect width="860" height="320" fill="#ffffff"/>
  <text class="title" x="32" y="42">残差连接：主分支计算时，旁路数据不能丢</text>
  <rect class="box" x="60" y="112" width="135" height="72"/>
  <text class="label" x="95" y="153">输入 X</text>
  <line x1="200" y1="148" x2="292" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="box" x="300" y="112" width="150" height="72"/>
  <text class="label" x="327" y="143">卷积/激活</text>
  <text class="note" x="337" y="166">主分支</text>
  <line x1="455" y1="148" x2="556" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <circle class="add" cx="590" cy="148" r="30"/>
  <text class="label" x="581" y="155">+</text>
  <line x1="620" y1="148" x2="718" y2="148" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect class="box" x="725" y="112" width="90" height="72"/>
  <text class="label" x="752" y="153">Y</text>
  <path d="M128 190 C160 260, 490 265, 578 180" fill="none" stroke="#f97316" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="buf" x="305" y="225" width="160" height="52"/>
  <text class="note" x="330" y="256">旁路可暂存在 buffer</text>
  <text class="note" x="60" y="292">若旁路先写回外部内存，再读回来相加，会增加带宽和能耗。</text>
</svg>
