<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">评测反馈到设计修改闭环</title>
  <desc id="desc">benchmark 发现问题后反馈到模型、量化、编译器、buffer/DMA、PE 和 runtime。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#273447"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .metric { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .fix { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; }
      .title { font: 700 24px 'Microsoft YaHei', Arial, sans-serif; fill: #172033; }
      .text { font: 600 16px 'Microsoft YaHei', Arial, sans-serif; fill: #172033; }
      .small { font: 13px 'Microsoft YaHei', Arial, sans-serif; fill: #475569; }
      .arrow { stroke: #273447; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1080" height="560"/>
  <text class="title" x="38" y="44">测量不是终点：每个异常都要回到设计变量</text>

  <rect class="metric" x="94" y="116" width="190" height="76" rx="8"/><text class="text" x="134" y="148">Latency 高</text><text class="small" x="124" y="171">拆端到端时间</text>
  <rect class="metric" x="324" y="116" width="190" height="76" rx="8"/><text class="text" x="360" y="148">Utilization 低</text><text class="small" x="356" y="171">查 tile/空等</text>
  <rect class="metric" x="554" y="116" width="190" height="76" rx="8"/><text class="text" x="598" y="148">DRAM 高</text><text class="small" x="590" y="171">查 copy/fusion</text>
  <rect class="metric" x="784" y="116" width="190" height="76" rx="8"/><text class="text" x="830" y="148">精度下降</text><text class="small" x="816" y="171">查量化边界</text>

  <rect class="fix" x="78" y="330" width="150" height="76" rx="8"/><text class="text" x="116" y="362">改模型</text><text class="small" x="100" y="385">算子/shape</text>
  <rect class="fix" x="268" y="330" width="150" height="76" rx="8"/><text class="text" x="306" y="362">改量化</text><text class="small" x="292" y="385">scale/校准</text>
  <rect class="fix" x="458" y="330" width="150" height="76" rx="8"/><text class="text" x="496" y="362">改编译器</text><text class="small" x="484" y="385">tile/fusion</text>
  <rect class="fix" x="648" y="330" width="150" height="76" rx="8"/><text class="text" x="686" y="362">改存储</text><text class="small" x="674" y="385">SRAM/DMA</text>
  <rect class="fix" x="838" y="330" width="150" height="76" rx="8"/><text class="text" x="876" y="362">改运行</text><text class="small" x="862" y="385">queue/submit</text>

  <path class="arrow" d="M189 192 C190 252 162 292 153 330"/>
  <path class="arrow" d="M419 192 C410 250 370 292 343 330"/>
  <path class="arrow" d="M649 192 C640 250 596 292 533 330"/>
  <path class="arrow" d="M879 192 C858 252 858 292 913 330"/>
  <path class="arrow" d="M744 192 C730 258 724 292 723 330"/>
  <text class="small" x="140" y="482">闭环要求：改完以后必须用同一 benchmark 协议重测，确认 latency、energy、accuracy 和稳定性是否真的改善。</text>
</svg>
