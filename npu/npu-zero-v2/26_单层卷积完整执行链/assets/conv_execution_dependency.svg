<svg xmlns="http://www.w3.org/2000/svg" width="940" height="370" viewBox="0 0 940 370" role="img" aria-labelledby="title desc">
  <title id="title">Single convolution layer dependency chain</title>
  <desc id="desc">A convolution layer depends on parameter parsing, DMA load, buffer residency, PE compute, psum completion, and output store.</desc>
  <style>
    text { font-family: Arial, sans-serif; font-size: 15px; fill: #162033; }
    .box { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 8; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 8; }
    .arrow { stroke: #334155; stroke-width: 2; marker-end: url(#arrow); fill: none; }
    .small { font-size: 13px; fill: #475569; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155" />
    </marker>
  </defs>
  <rect class="box" x="35" y="64" width="130" height="78" />
  <text x="100" y="96" text-anchor="middle" font-weight="bold">Layer params</text>
  <text class="small" x="100" y="121" text-anchor="middle">shape, stride, pad</text>
  <rect class="box" x="205" y="64" width="130" height="78" />
  <text x="270" y="96" text-anchor="middle" font-weight="bold">Tile plan</text>
  <text class="small" x="270" y="121" text-anchor="middle">loop ranges</text>
  <rect class="box" x="375" y="64" width="130" height="78" />
  <text x="440" y="96" text-anchor="middle" font-weight="bold">DMA load</text>
  <text class="small" x="440" y="121" text-anchor="middle">input + weight</text>
  <rect class="box" x="545" y="64" width="130" height="78" />
  <text x="610" y="96" text-anchor="middle" font-weight="bold">PE compute</text>
  <text class="small" x="610" y="121" text-anchor="middle">MAC schedule</text>
  <rect class="box" x="715" y="64" width="150" height="78" />
  <text x="790" y="96" text-anchor="middle" font-weight="bold">DMA store</text>
  <text class="small" x="790" y="121" text-anchor="middle">final output only</text>
  <path class="arrow" d="M165 103 H205" />
  <path class="arrow" d="M335 103 H375" />
  <path class="arrow" d="M505 103 H545" />
  <path class="arrow" d="M675 103 H715" />
  <rect class="warn" x="160" y="228" width="160" height="58" />
  <text x="240" y="262" text-anchor="middle">halo / padding</text>
  <rect class="warn" x="390" y="228" width="160" height="58" />
  <text x="470" y="262" text-anchor="middle">buffer capacity</text>
  <rect class="warn" x="620" y="228" width="160" height="58" />
  <text x="700" y="262" text-anchor="middle">psum lifetime</text>
  <path class="arrow" d="M240 228 C240 180 270 178 270 142" />
  <path class="arrow" d="M470 228 C470 178 440 178 440 142" />
  <path class="arrow" d="M700 228 C700 178 610 178 610 142" />
  <text class="small" x="470" y="338" text-anchor="middle">If any dependency is wrong, the layer may be numerically wrong even when each MAC datapath works.</text>
</svg>
