<svg xmlns="http://www.w3.org/2000/svg" width="940" height="520" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
  <title id="title">2x2 脉动矩阵乘的时间表</title>
  <desc id="desc">展示 2x2 矩阵乘中四个周期内每个 PE 的乘加内容和 partial sum 变化。</desc>
  <defs>
    <style>
      .bg { fill: #f8fafb; stroke: #d6e1e7; }
      .head { fill: #2f5f73; }
      .cell { fill: #ffffff; stroke: #9db2bc; stroke-width: 1.3; }
      .active { fill: #fff4de; stroke: #d38b1f; stroke-width: 1.5; }
      .done { fill: #e8f7ed; stroke: #2f855a; stroke-width: 1.5; }
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #1f333b; font-size: 22px; font-weight: 700; }
      .text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243942; font-size: 15px; }
      .white { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #ffffff; font-size: 15px; font-weight: 700; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #445a64; font-size: 13px; }
    </style>
  </defs>
  <rect x="25" y="25" width="890" height="470" class="bg"/>
  <text x="470" y="65" text-anchor="middle" class="title">2x2 矩阵乘：A 向右、B 向下时的相遇时间</text>
  <text x="470" y="95" text-anchor="middle" class="small">A=[[1,2],[3,4]], B=[[5,6],[7,8]], C=[[19,22],[43,50]]</text>

  <g transform="translate(70 125)">
    <rect x="0" y="0" width="120" height="45" class="head"/>
    <rect x="120" y="0" width="180" height="45" class="head"/>
    <rect x="300" y="0" width="180" height="45" class="head"/>
    <rect x="480" y="0" width="180" height="45" class="head"/>
    <rect x="660" y="0" width="180" height="45" class="head"/>
    <text x="60" y="28" text-anchor="middle" class="white">周期</text>
    <text x="210" y="28" text-anchor="middle" class="white">PE(0,0)</text>
    <text x="390" y="28" text-anchor="middle" class="white">PE(0,1)</text>
    <text x="570" y="28" text-anchor="middle" class="white">PE(1,0)</text>
    <text x="750" y="28" text-anchor="middle" class="white">PE(1,1)</text>

    <rect x="0" y="45" width="120" height="70" class="cell"/><text x="60" y="85" text-anchor="middle" class="text">0</text>
    <rect x="120" y="45" width="180" height="70" class="active"/><text x="210" y="72" text-anchor="middle" class="text">1*5</text><text x="210" y="98" text-anchor="middle" class="small">C00=5</text>
    <rect x="300" y="45" width="180" height="70" class="cell"/><text x="390" y="85" text-anchor="middle" class="small">等待</text>
    <rect x="480" y="45" width="180" height="70" class="cell"/><text x="570" y="85" text-anchor="middle" class="small">等待</text>
    <rect x="660" y="45" width="180" height="70" class="cell"/><text x="750" y="85" text-anchor="middle" class="small">等待</text>

    <rect x="0" y="115" width="120" height="70" class="cell"/><text x="60" y="155" text-anchor="middle" class="text">1</text>
    <rect x="120" y="115" width="180" height="70" class="done"/><text x="210" y="142" text-anchor="middle" class="text">2*7</text><text x="210" y="168" text-anchor="middle" class="small">C00=19</text>
    <rect x="300" y="115" width="180" height="70" class="active"/><text x="390" y="142" text-anchor="middle" class="text">1*6</text><text x="390" y="168" text-anchor="middle" class="small">C01=6</text>
    <rect x="480" y="115" width="180" height="70" class="active"/><text x="570" y="142" text-anchor="middle" class="text">3*5</text><text x="570" y="168" text-anchor="middle" class="small">C10=15</text>
    <rect x="660" y="115" width="180" height="70" class="cell"/><text x="750" y="155" text-anchor="middle" class="small">等待</text>

    <rect x="0" y="185" width="120" height="70" class="cell"/><text x="60" y="225" text-anchor="middle" class="text">2</text>
    <rect x="120" y="185" width="180" height="70" class="done"/><text x="210" y="225" text-anchor="middle" class="small">完成</text>
    <rect x="300" y="185" width="180" height="70" class="done"/><text x="390" y="212" text-anchor="middle" class="text">2*8</text><text x="390" y="238" text-anchor="middle" class="small">C01=22</text>
    <rect x="480" y="185" width="180" height="70" class="done"/><text x="570" y="212" text-anchor="middle" class="text">4*7</text><text x="570" y="238" text-anchor="middle" class="small">C10=43</text>
    <rect x="660" y="185" width="180" height="70" class="active"/><text x="750" y="212" text-anchor="middle" class="text">3*6</text><text x="750" y="238" text-anchor="middle" class="small">C11=18</text>

    <rect x="0" y="255" width="120" height="70" class="cell"/><text x="60" y="295" text-anchor="middle" class="text">3</text>
    <rect x="120" y="255" width="180" height="70" class="done"/><text x="210" y="295" text-anchor="middle" class="small">完成</text>
    <rect x="300" y="255" width="180" height="70" class="done"/><text x="390" y="295" text-anchor="middle" class="small">完成</text>
    <rect x="480" y="255" width="180" height="70" class="done"/><text x="570" y="295" text-anchor="middle" class="small">完成</text>
    <rect x="660" y="255" width="180" height="70" class="done"/><text x="750" y="282" text-anchor="middle" class="text">4*8</text><text x="750" y="308" text-anchor="middle" class="small">C11=50</text>
  </g>

  <text x="470" y="475" text-anchor="middle" class="small">时间错位使正确的 A[i,k] 和 B[k,j] 在 PE(i,j) 同周期相遇。</text>
</svg>
